[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "continuum_ftl"
version = "0.1.0"
description = "Stage 1: standalone PCC position IK and final-shape collision checking"
readme = "README_STAGE1.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["ruff>=0.8"]

[project.scripts]
continuum-ftl = "continuum_ftl.__main__:main"

[tool.setuptools.packages.find]
include = ["continuum_ftl*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
